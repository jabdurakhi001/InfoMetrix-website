    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What does an engagement with InfoMetrix look like?",
          "acceptedAnswer": { "@type": "Answer", "text": "We start with a diagnostic of your financial operations, then design and implement the systems: clean books, reporting structure, automation, and dashboards. Most clients continue with an ongoing fractional engagement where we operate and optimize what we built." }
        },
        {
          "@type": "Question",
          "name": "Do you replace our bookkeeper or CPA?",
          "acceptedAnswer": { "@type": "Answer", "text": "No — we build and operate the infrastructure around them. Day-to-day bookkeeping can be absorbed into our systems, but tax preparation and filings stay with your CPA. We make their job easier by handing them audit-ready books." }
        },
        {
          "@type": "Question",
          "name": "Which tools and platforms do you work with?",
          "acceptedAnswer": { "@type": "Answer", "text": "QuickBooks Online, NetSuite, and Xero on the accounting side; Ramp, Brex, Bill.com, and Stripe for spend and payments; Power BI and Tableau for dashboards — plus custom automation that connects them all." }
        },
        {
          "@type": "Question",
          "name": "How long until we see results?",
          "acceptedAnswer": { "@type": "Answer", "text": "The first systems are typically live within weeks. Full automation of your core workflows usually lands in one to three months, depending on the state of your books and the number of systems involved." }
        },
        {
          "@type": "Question",
          "name": "How is pricing structured?",
          "acceptedAnswer": { "@type": "Answer", "text": "Fixed monthly engagements, scoped after the diagnostic — no hourly billing surprises. The strategy call is where we figure out what scope actually fits your business." }
        },
        {
          "@type": "Question",
          "name": "Do you provide tax or legal advice?",
          "acceptedAnswer": { "@type": "Answer", "text": "No. InfoMetrix provides consulting and financial-systems services only. We coordinate closely with your CPA and counsel, but tax and legal advice stay with them." }
        }
      ]
    }
